<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Request | DJ Ashik Events 2026</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { 
            background: #0d0e15; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .card { 
            background: #161824; 
            padding: 32px 28px; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 420px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            border: 1px solid #2a2d3d; 
        }
        .logo-badge {
            display: inline-block;
            background: rgba(0, 229, 255, 0.1);
            color: #00e5ff;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 { 
            font-size: 1.75rem; 
            font-weight: 800;
            color: #ffffff; 
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        p { 
            color: #8e95a5; 
            font-size: 0.95rem; 
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            font-size: 0.88rem; 
            color: #c5cbd8; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, textarea { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            border: 1px solid #2e3245; 
            background: #0d0e15; 
            color: #fff; 
            font-size: 1rem; 
            transition: all 0.2s ease;
        }
        input:focus, textarea:focus { 
            border-color: #00e5ff; 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.15);
        }
        input::placeholder, textarea::placeholder {
            color: #525868;
        }
        button { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(135deg, #00e5ff 0%, #0088ff 100%); 
            border: none; 
            border-radius: 10px; 
            color: #000; 
            font-weight: 700; 
            font-size: 1.05rem; 
            cursor: pointer; 
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
        }
        button:active {
            transform: scale(0.98);
        }
        .footer-note {
            text-align: center;
            font-size: 0.78rem;
            color: #525868;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <span class="logo-badge">Live Request</span>
            <h1>DJ ASHIK EVENTS</h1>
            <p>Send your track requests directly to the DJ booth!</p>
        </div>

        <!-- 
            INSTRUCTIONS:
            Replace the action URL below with your Web3Forms or Formspree endpoint.
            Example Web3Forms: https://api.web3forms.com/submit
        -->
        <form action=https://formspree.io/f/moeqdzqe method="POST">
            
            <!-- Web3Forms Access Key Field (Uncomment if using Web3Forms) -->
            <!-- <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY"> -->

            <div class="form-group">
                <label for="name">Your Name / Table</label>
                <input type="text" id="name" name="Guest Name" placeholder="e.g., Sonu or VIP Table 2" required>
            </div>

            <div class="form-group">
                <label for="song">Song Name & Artist</label>
                <input type="text" id="song" name="Song Request" placeholder="e.g., Kala Chashma - Badshah" required>
            </div>

            <div class="form-group">
                <label for="note">Shoutout / Message (Optional)</label>
                <textarea id="note" name="Special Note" rows="3" placeholder="e.g., Shoutout to the birthday girl!"></textarea>
            </div>

            <button type="submit">SEND REQUEST 🎵</button>
        </form>

        <div class="footer-note">
            ⚡ Requests go straight to DJ Ashik's screen
        </div>
    </div>

</body>
</html>
